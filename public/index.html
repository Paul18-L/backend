<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Café Digital</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

  <style>
    body {
      background: #f7f3e9;
    }
    .navbar {
      background: #5a3825;
    }
    .navbar a {
      color: #fff !important;
      font-size: 1.1rem;
      font-weight: 500;
    }
    .navbar-brand {
      font-size: 1.5rem;
      font-weight: bold;
    }
    .footer {
      background: #5a3825;
      color: #fff;
      text-align: center;
      padding: 20px;
      margin-top: 40px;
    }
    .card img {
      height: 200px;
      object-fit: cover;
      border-radius: 6px;
    }
  </style>
</head>

<body>

  <!-- NAVBAR ------------------------------- -->
  <nav class="navbar navbar-expand-lg px-4">
    <a class="navbar-brand">☕ Café Digital</a>

    <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
      ☰
    </button>

    <div class="collapse navbar-collapse" id="navContent">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="#">Inicio</a></li>
        <li class="nav-item"><a class="nav-link" href="#menuArea">Menú</a></li>
        <li class="nav-item"><a class="nav-link" href="#productos">Productos Agregados</a></li>
        <li class="nav-item"><a class="nav-link" href="#contacto">Contáctanos</a></li>
      </ul>
    </div>
  </nav>

  <!-- CARRUSEL ---------------------------- -->
  <div id="carouselCafe" class="carousel slide container mt-4 shadow rounded" data-bs-ride="carousel">
    <div class="carousel-inner rounded">

      <div class="carousel-item active">
        <img src="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085" class="d-block w-100">
      </div>

      <div class="carousel-item">
        <img src="https://images.unsplash.com/photo-1509042239860-f550ce710b93" class="d-block w-100">
      </div>

      <div class="carousel-item">
        <img src="https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd" class="d-block w-100">
      </div>

      <div class="carousel-item">
        <img src="https://images.unsplash.com/photo-1511920170033-f8396924c348" class="d-block w-100">
      </div>

      <div class="carousel-item">
        <img src="https://images.unsplash.com/photo-1510626176961-4b57d4fbad03" class="d-block w-100">
      </div>

    </div>

    <button class="carousel-control-prev" type="button" data-bs-target="#carouselCafe" data-bs-slide="prev">
      <span class="carousel-control-prev-icon"></span>
    </button>

    <button class="carousel-control-next" type="button" data-bs-target="#carouselCafe" data-bs-slide="next">
      <span class="carousel-control-next-icon"></span>
    </button>
  </div>

  <!-- FORMULARIO --------------------------------------- -->
  <section class="container mt-5" id="menuArea">
    <h2 class="text-center mb-3">Agregar Producto</h2>

    <form id="formProducto" class="row g-3">

      <div class="col-md-3">
        <label class="form-label">Nombre</label>
        <input type="text" id="nombre" class="form-control" required />
      </div>

      <div class="col-md-3">
        <label class="form-label">Precio ($)</label>
        <input type="number" id="precio" class="form-control" required />
      </div>

      <div class="col-md-3">
        <label class="form-label">Categoría</label>
        <input type="text" id="categoria" class="form-control" required />
      </div>

      <div class="col-md-3">
        <label class="form-label">URL Imagen</label>
        <input type="text" id="imagen" class="form-control" placeholder="https://..." required />
      </div>

      <div class="col-12 text-center">
        <button class="btn btn-dark px-5">Agregar</button>
      </div>

    </form>
  </section>

  <!-- LISTA PRODUCTOS -------------------------------- -->
  <section class="container mt-5" id="productos">
    <h2 class="text-center mb-4">Productos Agregados</h2>
    <div id="listaProductos" class="row g-4"></div>
  </section>

  <!-- CONTACTO --------------------------------------- -->
  <section class="container mt-5" id="contacto">
    <h2 class="text-center">Contáctanos</h2>
    <p class="text-center">📞 Teléfono: +593 999 999 999</p>
    <p class="text-center">📧 Email: contacto@cafedigital.com</p>
  </section>

  <!-- FOOTER -->
  <div class="footer">
    &copy; 2025 Café Digital — Proyecto Full Stack
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const API_URL = "/api/productos";

    // ---------------- CARGAR ------------------
    async function cargarProductos() {
      const res = await fetch(API_URL);
      const data = await res.json();

      const cont = document.getElementById("listaProductos");
      cont.innerHTML = "";

      data.forEach(prod => {
        cont.innerHTML += `
          <div class="col-md-4">
            <div class="card shadow p-3">
              <img src="${prod.imagen}" class="w-100 mb-2">

              <h5>${prod.nombre}</h5>
              <p><b>Precio:</b> $${prod.precio}</p>
              <p><b>Categoría:</b> ${prod.categoria}</p>

              <button class="btn btn-warning btn-sm" 
                onclick="editarProducto('${prod._id}', '${prod.nombre}', '${prod.precio}', '${prod.categoria}', '${prod.imagen}')">
                Editar
              </button>

              <button class="btn btn-danger btn-sm" onclick="eliminarProducto('${prod._id}')">
                Eliminar
              </button>
            </div>
          </div>
        `;
      });
    }

    // ---------------- AGREGAR ------------------
    document.getElementById("formProducto").addEventListener("submit", async (e) => {
      e.preventDefault();

      const nuevo = {
        nombre: nombre.value,
        precio: precio.value,
        categoria: categoria.value,
        imagen: imagen.value,
      };

      await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(nuevo),
      });

      e.target.reset();
      cargarProductos();
    });

    // ---------------- EDITAR ------------------
    async function editarProducto(id, nombre, precio, categoria, imagen) {
      const nNombre = prompt("Nuevo nombre:", nombre);
      const nPrecio = prompt("Nuevo precio:", precio);
      const nCategoria = prompt("Nueva categoría:", categoria);
      const nImagen = prompt("Nueva URL imagen:", imagen);

      await fetch(`${API_URL}/${id}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          nombre: nNombre,
          precio: nPrecio,
          categoria: nCategoria,
          imagen: nImagen,
        }),
      });

      cargarProductos();
    }

    // ---------------- ELIMINAR ------------------
    async function eliminarProducto(id) {
      if (!confirm("¿Eliminar este producto?")) return;

      await fetch(`${API_URL}/${id}`, { method: "DELETE" });
      cargarProductos();
    }

    cargarProductos();
  </script>

</body>
</html>
